<!doctype html>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1280px; height:360px; overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(120% 140% at 12% 0%, #1e3a5f 0%, #0f172a 55%, #0b1220 100%);
    color:#e2e8f0; position:relative;
  }
  .grid {
    position:absolute; inset:0; opacity:.22;
    background-image:radial-gradient(#94a3b8 1px, transparent 1px);
    background-size:26px 26px;
    mask-image:linear-gradient(105deg, #000 0%, transparent 62%);
    -webkit-mask-image:linear-gradient(105deg, #000 0%, transparent 62%);
  }
  .wrap { position:relative; padding:52px 0 0 64px; }
  h1 {
    font-size:76px; font-weight:800; letter-spacing:-2.5px; line-height:1;
    background:linear-gradient(92deg,#ffffff 28%,#7dd3fc 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub { margin-top:16px; font-size:21px; color:#94a3b8; letter-spacing:.2px; }
  .chips { margin-top:26px; display:flex; gap:10px; }
  .chip {
    font-size:14px; font-weight:600; padding:7px 15px; border-radius:999px;
    border:1px solid; backdrop-filter:blur(2px);
  }
  .c1 { color:#fca5a5; border-color:#7f1d1d; background:#450a0a66; }
  .c2 { color:#93c5fd; border-color:#1e3a8a; background:#17255466; }
  .c3 { color:#86efac; border-color:#14532d; background:#052e1666; }
  .c4 { color:#fdba74; border-color:#7c2d12; background:#43140766; }
  .badge {
    position:absolute; top:40px; right:56px; text-align:right;
    font-size:13px; color:#64748b; line-height:1.9; letter-spacing:.6px;
  }
  .badge b { color:#7dd3fc; font-weight:600; }
  .art { position:absolute; right:64px; bottom:34px; display:flex; gap:12px; align-items:flex-end; }
  .bar { width:16px; border-radius:5px 5px 2px 2px; opacity:.92; }
  .b1 { height:42px; background:linear-gradient(#f87171,#7f1d1d); }
  .b2 { height:64px; background:linear-gradient(#60a5fa,#1e3a8a); }
  .b3 { height:86px; background:linear-gradient(#4ade80,#14532d); }
  .b4 { height:108px; background:linear-gradient(#fb923c,#7c2d12); }
</style>
<div class="grid"></div>
<div class="wrap">
  <h1>study-coach</h1>
  <div class="sub">A four-mode study companion skill for AI agents.</div>
  <div class="chips">
    <span class="chip c1">1 · Homework guide</span>
    <span class="chip c2">2 · Quiz grading</span>
    <span class="chip c3">3 · Knowledge breakdown</span>
    <span class="chip c4">4 · Review &amp; mock test</span>
  </div>
</div>
<div class="badge">
  <b>MIT</b> licensed · 100% Python stdlib<br>
  zero personal data · configurable<br>
  works on Windows / macOS / Linux
</div>
<div class="art">
  <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div>
</div>
